          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:padding="16dp">

              <!-- ===== Top status bar ===== -->
              <TextView
                  android:id="@+id/clock"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="17:37"
                  android:textColor="@color/text_primary"
                  android:textSize="26sp"
                  android:textStyle="bold"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent" />

              <TextView
                  android:id="@+id/date"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginStart="14dp"
                  android:text="Pazartesi, 1 Eylül"
                  android:textColor="@color/text_secondary"
                  android:textSize="15sp"
                  app:layout_constraintBottom_toBottomOf="@id/clock"
                  app:layout_constraintStart_toEndOf="@id/clock"
                  app:layout_constraintTop_toTopOf="@id/clock" />

              <ImageView
                  android:id="@+id/iconWifi"
                  android:layout_width="22dp"
                  android:layout_height="22dp"
                  android:layout_marginEnd="16dp"
                  android:src="@drawable/ic_wifi"
                  app:layout_constraintBottom_toBottomOf="@id/clock"
                  app:layout_constraintEnd_toStartOf="@id/iconBt"
                  app:layout_constraintTop_toTopOf="@id/clock" />

              <ImageView
                  android:id="@+id/iconBt"
                  android:layout_width="22dp"
                  android:layout_height="22dp"
                  android:src="@drawable/ic_bluetooth"
                  app:layout_constraintBottom_toBottomOf="@id/clock"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintTop_toTopOf="@id/clock" />

              <!-- ===== App grid ===== -->
              <androidx.recyclerview.widget.RecyclerView
                  android:id="@+id/rvApps"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:layout_marginTop="18dp"
                  android:clipToPadding="false"
                  app:layout_constraintTop_toBottomOf="@id/clock"
                  app:layout_constraintBottom_toTopOf="@id/npBar"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />

              <!-- ===== Now playing bar ===== -->
              <LinearLayout
                  android:id="@+id/npBar"
                  android:layout_width="match_parent"
                  android:layout_height="76dp"
                  android:layout_marginTop="12dp"
                  android:background="@drawable/card_bg"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingHorizontal="16dp"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent">

                  <ImageView
                      android:id="@+id/npAlbum"
                      android:layout_width="48dp"
                      android:layout_height="48dp"
                      android:background="@drawable/circle_accent"
                      android:padding="12dp"
                      android:src="@drawable/ic_music"
                      app:tint="@color/accent" />

                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="14dp"
                      android:layout_weight="1"
                      android:orientation="vertical">

                      <TextView
                          android:id="@+id/npTitle"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:ellipsize="end"
                          android:maxLines="1"
                          android:text="@string/now_playing_idle"
                          android:textColor="@color/text_primary"
                          android:textSize="17sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/npArtist"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:ellipsize="end"
                          android:maxLines="1"
                          android:text="@string/bt_hint"
                          android:textColor="@color/text_secondary"
                          android:textSize="14sp" />
                  </LinearLayout>

                  <ImageButton
                      android:id="@+id/btnPrev"
                      android:layout_width="52dp"
                      android:layout_height="52dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:src="@drawable/ic_prev"
                      app:tint="@color/text_primary" />

                  <ImageButton
                      android:id="@+id/btnPlay"
                      android:layout_width="56dp"
                      android:layout_height="56dp"
                      android:layout_marginHorizontal="6dp"
                      android:background="?attr/selectableItemBackgroundBorderless"
                      android:src="@drawable/ic_play"
                      app:tint="@color/accent" />

