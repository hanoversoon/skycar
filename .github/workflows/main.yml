name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Projeyi olustur ve derle
        run: |
          set -e
          cat > settings.gradle.kts <<'__SKYEOF__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SkyCar"
          include(":app")
          __SKYEOF__
          cat > build.gradle.kts <<'__SKYEOF__'
          // Top-level build file
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          __SKYEOF__
          cat > gradle.properties <<'__SKYEOF__'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          __SKYEOF__
          mkdir -p app
          cat > app/build.gradle.kts <<'__SKYEOF__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.skywell.skycar"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.skywell.skycar"
                  minSdk = 24          // Android 7.0 – most car head units are >= this
                  targetSdk = 34
                  versionCode = 3
                  versionName = "1.2"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  viewBinding = true
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
          }
          __SKYEOF__
          cat > app/proguard-rules.pro <<'__SKYEOF__'
          # Add project specific ProGuard rules here.
          __SKYEOF__
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'__SKYEOF__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Media keys go through AudioManager (no permission needed).
                   QUERY_ALL_PACKAGES lets the launcher see and open the car's apps
                   on Android 11+ (this app is sideloaded, not distributed via Play). -->
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.SkyCar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <!-- Normal app launcher entry -->
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <!-- Optional: allow this app to be chosen as the car HOME screen.
                           Comment this block out if you do NOT want it to replace the
                           stock home launcher. -->
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".VehicleActivity"
                      android:exported="false"
                      android:screenOrientation="landscape"
                      android:theme="@style/Theme.SkyCar" />

                  <activity
                      android:name=".ClimateActivity"
                      android:exported="false"
                      android:screenOrientation="landscape"
                      android:theme="@style/Theme.SkyCar" />

              </application>
          </manifest>
          __SKYEOF__
          mkdir -p app/src/main/java/com/skywell/skycar
          cat > app/src/main/java/com/skywell/skycar/AppItem.kt <<'__SKYEOF__'
          package com.skywell.skycar

          import androidx.annotation.ColorRes
          import androidx.annotation.DrawableRes
          import androidx.annotation.StringRes

          /**
           * One tile on the CarPlay-style home grid.
           *
           * A tile either launches an installed app by [pkg], or opens one of our own
           * internal screens via [internal]. If [pkg] is set but that app cannot be
           * launched, we fall back to [internal] when provided.
           */
          data class AppItem(
              @StringRes val labelRes: Int,
              @DrawableRes val iconRes: Int,
              @ColorRes val colorRes: Int,
              val pkg: String? = null,
              val internal: String? = null
          ) {
              companion object {
                  // Internal screen ids
                  const val VEHICLE = "vehicle"
                  const val CLIMATE = "climate"
              }
          }
          __SKYEOF__
          cat > app/src/main/java/com/skywell/skycar/AppsAdapter.kt <<'__SKYEOF__'
          package com.skywell.skycar

          import android.content.res.ColorStateList
          import android.view.LayoutInflater
          import android.view.ViewGroup
          import androidx.core.content.ContextCompat
          import androidx.recyclerview.widget.RecyclerView
          import com.skywell.skycar.databinding.ItemAppBinding

          class AppsAdapter(
              private val items: List<AppItem>,
              private val onClick: (AppItem) -> Unit
          ) : RecyclerView.Adapter<AppsAdapter.VH>() {

              inner class VH(val b: ItemAppBinding) : RecyclerView.ViewHolder(b.root)

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                  val b = ItemAppBinding.inflate(LayoutInflater.from(parent.context), parent, false)
                  return VH(b)
              }

              override fun onBindViewHolder(holder: VH, position: Int) {
                  val item = items[position]
                  val ctx = holder.b.root.context
                  holder.b.label.setText(item.labelRes)
                  holder.b.icon.setImageResource(item.iconRes)
                  // tint the rounded tile with the item's accent color
                  holder.b.tile.backgroundTintList =
                      ColorStateList.valueOf(ContextCompat.getColor(ctx, item.colorRes))
                  holder.b.root.setOnClickListener { onClick(item) }
              }

              override fun getItemCount() = items.size
          }
          __SKYEOF__
          cat > app/src/main/java/com/skywell/skycar/MainActivity.kt <<'__SKYEOF__'
          package com.skywell.skycar

          import android.content.Intent
          import android.media.AudioManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.KeyEvent
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.recyclerview.widget.GridLayoutManager
          import com.skywell.skycar.databinding.ActivityMainBinding
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private lateinit var b: ActivityMainBinding
              private lateinit var audio: AudioManager
              private var isPlaying = false

              private val clockHandler = Handler(Looper.getMainLooper())
              private val clockTick = object : Runnable {
                  override fun run() {
                      updateClock()
                      clockHandler.postDelayed(this, 1000)
                  }
              }

              // Tiles wired to THIS car's real apps (Skywell / coocaa OS).
              private val tiles = listOf(
                  AppItem(R.string.tile_maps,       R.drawable.ic_maps,     R.color.tile_maps,     pkg = "ru.yandex.yandexnavi"),
                  AppItem(R.string.tile_phone,      R.drawable.ic_phone,    R.color.tile_phone,    pkg = "com.skyworth.car.skycommunication"),
                  AppItem(R.string.tile_btmusic,    R.drawable.ic_music,    R.color.tile_music,    pkg = "com.skyworth.car.carbtmusic"),
                  AppItem(R.string.tile_localmusic, R.drawable.ic_music,    R.color.tile_spotify,  pkg = "com.skyworth.car.localmedia"),
                  AppItem(R.string.tile_radio,      R.drawable.ic_radio,    R.color.tile_radio,    pkg = "com.skyworth.car.carradio"),
                  AppItem(R.string.tile_climate,    R.drawable.ic_climate,  R.color.tile_climate,  pkg = "com.coolwell.ai.skyhvac", internal = AppItem.CLIMATE),
                  AppItem(R.string.tile_mirror,     R.drawable.ic_mirror,   R.color.tile_mirror,   pkg = "net.easyconn"),
                  AppItem(R.string.tile_settings,   R.drawable.ic_settings, R.color.tile_settings, pkg = "com.skyworth.car.systemsettings"),
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  b = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(b.root)

                  audio = getSystemService(AUDIO_SERVICE) as AudioManager

                  b.rvApps.layoutManager = GridLayoutManager(this, 4)
                  b.rvApps.adapter = AppsAdapter(tiles) { onTile(it) }

                  b.btnPrev.setOnClickListener { sendMediaKey(KeyEvent.KEYCODE_MEDIA_PREVIOUS) }
                  b.btnNext.setOnClickListener { sendMediaKey(KeyEvent.KEYCODE_MEDIA_NEXT) }
                  b.btnPlay.setOnClickListener {
                      sendMediaKey(KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE)
                      isPlaying = !isPlaying
                      b.btnPlay.setImageResource(if (isPlaying) R.drawable.ic_pause else R.drawable.ic_play)
                  }
                  // Tapping the now-playing area opens the Bluetooth music app
                  b.npAlbum.setOnClickListener { openApp("com.skyworth.car.carbtmusic", null) }
              }

              override fun onResume() {
                  super.onResume()
                  clockTick.run()
              }

              override fun onPause() {
                  super.onPause()
                  clockHandler.removeCallbacks(clockTick)
              }

              private fun updateClock() {
                  val now = Date()
                  b.clock.text = SimpleDateFormat("HH:mm", Locale.getDefault()).format(now)
                  b.date.text = SimpleDateFormat("EEEE, d MMMM", Locale("tr", "TR")).format(now)
              }

              private fun onTile(item: AppItem) {
                  when {
                      item.pkg != null -> openApp(item.pkg, item.internal)
                      item.internal != null -> openInternal(item.internal)
                      else -> toast(getString(R.string.not_installed))
                  }
              }

              /** Launch an installed app by package; fall back to an internal screen or a toast. */
              private fun openApp(pkg: String, fallbackInternal: String?) {
                  val launch = packageManager.getLaunchIntentForPackage(pkg)
                  if (launch != null) {
                      launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(launch)
                      return
                  }
                  if (fallbackInternal != null) {
                      openInternal(fallbackInternal)
                  } else {
                      toast(getString(R.string.not_installed))
                  }
              }

              private fun openInternal(which: String) {
                  when (which) {
                      AppItem.VEHICLE -> startActivity(Intent(this, VehicleActivity::class.java))
                      AppItem.CLIMATE -> startActivity(Intent(this, ClimateActivity::class.java))
                  }
              }

              private fun sendMediaKey(keyCode: Int) {
                  audio.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, keyCode))
                  audio.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, keyCode))
              }

              private fun toast(msg: String) =
                  Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()

              override fun onBackPressed() { /* stay on home */ }
          }
          __SKYEOF__
          cat > app/src/main/java/com/skywell/skycar/VehicleActivity.kt <<'__SKYEOF__'
          package com.skywell.skycar

          import android.os.BatteryManager
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import com.skywell.skycar.databinding.ActivityVehicleBinding

          /**
           * Vehicle info screen.
           *
           * NOTE: Real vehicle telemetry (speed, state of charge, range, odometer) comes
           * from the car's CAN bus and is only exposed through the manufacturer's
           * (Skywell) system APIs, which require a signed system app. The values below are
           * a UI template. The head-unit battery level is read as a live example so you
           * can see how a real signal would be bound.
           */
          class VehicleActivity : AppCompatActivity() {

              private lateinit var b: ActivityVehicleBinding

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  b = ActivityVehicleBinding.inflate(layoutInflater)
                  setContentView(b.root)

                  b.btnBack.setOnClickListener { finish() }

                  // Live example: head-unit battery percentage
                  val bm = getSystemService(BATTERY_SERVICE) as? BatteryManager
                  val pct = bm?.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY) ?: -1
                  if (pct in 0..100) b.valBattery.text = "$pct %"
              }
          }
          __SKYEOF__
          cat > app/src/main/java/com/skywell/skycar/ClimateActivity.kt <<'__SKYEOF__'
          package com.skywell.skycar

          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import com.skywell.skycar.databinding.ActivityClimateBinding

          /**
           * Climate UI template.
           *
           * NOTE: Actually driving the HVAC hardware requires the manufacturer (Skywell)
           * API / a system-signed app. This screen keeps local state so the controls feel
           * real; wire the setters to the OEM API to make them live.
           */
          class ClimateActivity : AppCompatActivity() {

              private lateinit var b: ActivityClimateBinding

              private var temp = 22.0   // °C
              private var fan = 3       // 0..7

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  b = ActivityClimateBinding.inflate(layoutInflater)
                  setContentView(b.root)

                  b.btnBack.setOnClickListener { finish() }

                  renderTemp()
                  renderFan()

                  b.btnTempUp.setOnClickListener {
                      if (temp < 30.0) { temp += 0.5; renderTemp() }
                  }
                  b.btnTempDown.setOnClickListener {
                      if (temp > 16.0) { temp -= 0.5; renderTemp() }
                  }
                  b.btnFanUp.setOnClickListener {
                      if (fan < 7) { fan++; renderFan() }
                  }
                  b.btnFanDown.setOnClickListener {
                      if (fan > 0) { fan--; renderFan() }
                  }
              }

              private fun renderTemp() {
                  b.valTemp.text = String.format("%.1f°", temp)
              }

              private fun renderFan() {
                  b.valFan.text = fan.toString()
              }
          }
